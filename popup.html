<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 230px; margin: 0; padding: 12px; background: #1f1f1f; color: #eee;
         font: 13px sans-serif; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  label { display: flex; align-items: center; justify-content: space-between;
          margin: 8px 0; gap: 8px; }
  input[type="color"] { width: 44px; height: 26px; border: 0; padding: 0;
          background: none; cursor: pointer; }
  input[type="range"] { width: 110px; }
</style>
</head>
<body>
  <h3>Subtitle style</h3>
  <label>Text color <input type="color" id="color"></label>
  <label>Outline <input type="checkbox" id="outline"></label>
  <label>Outline color <input type="color" id="outlineColor"></label>
  <label>Outline size <input type="range" id="outlineSize" min="0" max="4" step="1"></label>
  <label>Background color <input type="color" id="bg"></label>
  <label>Background opacity <input type="range" id="bgOpacity" min="0" max="100" step="5"></label>
  <script src="popup.js"></script>
</body>
</html>
